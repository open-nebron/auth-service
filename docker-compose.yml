version: '3.8'

services:
  mongo:
    image: mongo:7.0
    container_name: nebron-auth-mongo
    ports:
      - "27017:27017"
    environment:
      MONGO_INITDB_DATABASE: nebron_auth
    volumes:
      - mongo_data:/data/db
    healthcheck:
      test: ["CMD", "mongosh", "--quiet", "--eval", "db.adminCommand('ping').ok"]
      interval: 5s
      timeout: 3s
      retries: 10
      start_period: 5s
    restart: unless-stopped
    networks:
      - nebron-auth-net

  redis:
    image: redis:7-alpine
    container_name: nebron-auth-redis
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10
      start_period: 3s
    restart: unless-stopped
    networks:
      - nebron-auth-net

  auth-service:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: nebron-auth-service
    ports:
      - "4001:4001"
    environment:
      PORT: 4001
      NODE_ENV: development
      LOG_LEVEL: info
      MONGO_URL: mongodb://mongo:27017/nebron_auth
      REDIS_URL: redis://redis:6379
      JWT_PRIVATE_KEY_PATH: ./secrets/jwt_private.pem
      JWT_PUBLIC_KEY_PATH: ./secrets/jwt_public.pem
      JWT_CURRENT_KID: dev-1
      ACCESS_TOKEN_TTL_SECONDS: 900
      REFRESH_TOKEN_TTL_DAYS: 30
      ALLOWED_ORIGINS: http://localhost:3000,http://localhost:8081
    volumes:
      - ./secrets:/app/secrets
    depends_on:
      mongo:
        condition: service_healthy
      redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://localhost:4001/health"]
      interval: 10s
      timeout: 3s
      retries: 5
      start_period: 5s
    restart: unless-stopped
    networks:
      - nebron-auth-net

volumes:
  mongo_data:
  redis_data:

networks:
  nebron-auth-net:
    driver: bridge
